<!-- Update app modal -->
  <div id="updateAppModal" class="hidden fixed inset-0 z-50 bg-black/25 p-6">
    <div class="mx-auto mt-8 flex max-h-[84vh] w-full max-w-3xl flex-col overflow-hidden rounded-2xl border border-gray-200 bg-white shadow-2xl">
      <div class="shrink-0 border-b border-gray-200 p-4 flex items-center justify-between">
        <div class="text-base font-semibold text-gray-900" data-i18n="updateAppTitle">Update App</div>
        <button id="closeUpdateAppBtn" class="h-8 w-8 rounded-lg border border-gray-300 bg-white text-gray-600 hover:bg-gray-50">×</button>
      </div>
      <div class="min-h-0 flex-1 overflow-auto p-4 space-y-4">
        <div class="grid grid-cols-1 gap-3 sm:grid-cols-2">
          <div class="rounded-xl border border-gray-200 bg-gray-50 p-3">
            <div class="text-[11px] font-semibold uppercase tracking-wide text-gray-500" data-i18n="updateInstalledVersion">Installed version</div>
            <div id="updateInstalledVersionValue" class="mt-1 text-sm font-semibold text-gray-900">-</div>
          </div>
          <div class="rounded-xl border border-gray-200 bg-gray-50 p-3">
            <div class="text-[11px] font-semibold uppercase tracking-wide text-gray-500" data-i18n="updateAvailableVersion">Available version</div>
            <div id="updateAvailableVersionValue" class="mt-1 text-sm font-semibold text-gray-900">-</div>
          </div>
        </div>
        <div class="rounded-xl border border-gray-200 bg-white p-3">
          <div class="mb-2 text-[11px] font-semibold uppercase tracking-wide text-gray-500" data-i18n="updateCheckStatus">Status</div>
          <div id="updateCheckStatusText" class="text-sm text-gray-700"></div>
          <div class="mt-3">
            <button id="updateVerifyAgainBtn" class="h-8 rounded bg-blue-600 px-3 text-sm font-medium text-white hover:bg-blue-700 disabled:cursor-not-allowed disabled:opacity-40" data-i18n="updateCheckAgain">Check again</button>
            <button id="updateApplyBtn" class="hidden h-8 rounded bg-emerald-600 px-3 text-sm font-medium text-white hover:bg-emerald-700 disabled:cursor-not-allowed disabled:opacity-40" data-i18n="updateApply">Apply update</button>
          </div>
        </div>
        <div class="rounded-xl border border-gray-200 bg-white">
          <div class="border-b border-gray-200 bg-gray-50 px-3 py-2">
            <div class="text-xs font-semibold uppercase tracking-wide text-gray-600" data-i18n="updateBackupsTitle">Local update backups</div>
            <div class="mt-1 text-[11px] text-gray-500" data-i18n="updateBackupsHelp">Backups are created in this browser before applying an app update.</div>
          </div>
          <div id="updateBackupsBox" class="space-y-2 p-3 text-xs text-gray-700" aria-live="polite">-</div>
        </div>
        <div class="rounded-xl border border-gray-200 bg-white">
          <div class="border-b border-gray-200 bg-gray-50 px-3 py-2 text-xs font-semibold uppercase tracking-wide text-gray-600" data-i18n="updateWhatChanged">What changed</div>
          <div id="updateChangelogBox" class="max-h-[42vh] overflow-auto p-3 text-xs leading-5 text-gray-700" aria-live="polite">-</div>
        </div>
      </div>
      <div class="shrink-0 border-t border-gray-200 p-3 flex justify-end">
        <button id="updateCloseBtn" class="h-8 rounded border border-gray-300 bg-white px-3 text-sm font-medium text-gray-700 hover:bg-gray-50" data-i18n="updateClose">Close</button>
      </div>
    </div>
  </div>
