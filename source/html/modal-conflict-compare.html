<!-- Conflict compare modal -->
  <div id="conflictCompareModal" class="hidden fixed inset-0 z-[80] bg-black/25 p-4 sm:p-6">
    <div class="mx-auto mt-2 sm:mt-8 flex max-h-[90vh] w-full max-w-6xl flex-col overflow-hidden rounded-2xl border border-gray-200 bg-white shadow-2xl">
      <div class="border-b border-gray-200 px-4 py-3 sm:px-5">
        <div id="conflictCompareTitle" class="text-base font-semibold text-gray-900" data-i18n="conflictCompareTitle">Resolve conflict</div>
        <div id="conflictCompareSubtitle" class="mt-1 text-xs text-gray-500"></div>
      </div>
      <div class="min-h-0 flex-1 overflow-auto p-4 sm:p-5">
        <div class="space-y-4">
          <div class="grid grid-cols-1 gap-4 lg:grid-cols-2">
            <div id="conflictLocalColumn"></div>
            <div id="conflictRemoteColumn"></div>
          </div>
          <div class="overflow-hidden rounded-xl border border-gray-200 bg-white">
            <div class="border-b border-gray-200 bg-gray-50 px-3 py-2 flex flex-wrap items-center justify-between gap-2">
              <div class="text-xs font-semibold uppercase tracking-wide text-gray-600" data-i18n="draftFieldHtml">HTML / code</div>
              <div id="conflictCodeDiffLegend" class="flex flex-wrap items-center gap-2 text-[11px]"></div>
            </div>
            <div id="conflictCodeDiffMonaco" class="hidden w-full" style="height:320px;"></div>
            <div id="conflictCodeDiffFallback" class="hidden overflow-hidden bg-white" style="height:320px;">
              <div class="grid h-full grid-cols-1 gap-px bg-gray-200 lg:grid-cols-2">
                <div id="conflictFallbackLeftPane" class="min-h-0 overflow-auto bg-white"></div>
                <div id="conflictFallbackRightPane" class="min-h-0 overflow-auto bg-white"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="border-t border-gray-200 px-4 py-3 sm:px-5 flex flex-wrap items-center justify-end gap-2">
        <button id="conflictLoadRemoteBtn" class="h-9 rounded-lg border border-amber-300 bg-amber-50 px-3 text-sm font-medium text-amber-800 hover:bg-amber-100" data-i18n="conflictLoadRemote">Load Fibery version</button>
        <button id="conflictKeepLocalBtn" class="h-9 rounded-lg bg-blue-600 px-3 text-sm font-medium text-white hover:bg-blue-700">Keep my edits</button>
      </div>
    </div>
  </div>
